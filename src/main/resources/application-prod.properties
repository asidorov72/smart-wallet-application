server.port=8093
spring.application.name=Smart Wallet Application

# Base configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql-standalone:3306/smart_wallet_app?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DATABASE_PASSWORD}
logging.level.org.hibernate.persister.entity=ERROR

spring.mvc.hiddenmethod.filter.enabled=true

# Notification configuration
#notification.base-url=http://google-cloud/api/v1/notifications
notification.base-url=${NOTIFICATION_SVC_URL}
notification.service.api-key=${CLIENT_SECRET}